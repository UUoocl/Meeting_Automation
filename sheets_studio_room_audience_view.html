	<!-- Initialize the presentation -->
	<script>
		let tableData;

		Reveal.initialize({
			width: 1280,
			height: 720,
			margin: 0.0,
			controls: false,
			// transition: "fade",
			// backgroundTransition: "fade",
			progress: false,
		});
		
		Reveal.on('ready', event => {
			console.log("reveal ready to run");
			const paramsString = window.location.search;
            const searchParams = new URLSearchParams(paramsString);
            
            const tableData = {} 
            tableData.sheetID = searchParams.get("sheetID")
			tableData.sheetName = searchParams.get("sheetName");
			tableData.sheetRange = searchParams.get("sheetRange");
			getSheetData(tableData);
		})

		//called from the script getSheetData.js
		function loadData(headers, data){
            console.log("load data", headers, data);
			createSlides(data);
			tableData = data;
		}

		async function createSlides(slidesContent) {
			document.getElementById('placeholder').remove();

			console.log("load slides", slidesContent)
			for (let i = 0; i < slidesContent.length; i++) {
				// 1. Select the parent element
				const parentElement = document.getElementById('slides');

				// 2. Create the new element
				const newElement = document.createElement('section');

				// 3. Add content to the new element (optional)
				slidesContent[i].Duration = "";
				// newElement.id = `slide {{}}i}`
				// // 4. Append the new element
				// parentElement.appendChild(newElement);
				// Reveal.next()
			}

			const slideData = [
								{
									id: 0,
									title: "Introduction",
									content: "Welcome to this presentation!",
									items: ["Point 1", "Point 2"]
								},
								{
									id: 1,	
									title: "Key Concepts",
									content: "Understanding the core ideas.",
									items: ["Concept A", "Concept B", "Concept C"]
								}

							];
			
			console.log("slide data", slideData)
			const source = document.getElementById('slide-template').innerHTML;
			const template = Handlebars.compile(source);
			const slidesContainer = document.getElementById('slides');

			slidesContent.forEach(data => {
				const html = template(data);
				slidesContainer.innerHTML += html;
			});

			Reveal.slide(0)

			console.log("slide creation complete")
		return;
		}

		async function changeAgendaItem(slideID){
			//hide
			disableSource('Meeting', 'lower_Thirds+').then(async () =>
				await setTimeout( () => {
					Reveal.slide(slideID);
					//show
					enableSource('Meeting', 'lower_Thirds+');
				}
				, 300)		
			)
		}

		window.addEventListener(`lowerSectionChange`, function (event) {
            //section command
			console.log("message received: ", event)
			if(event.detail.msg.setSection){
				console.log(tableData, event.detail.msg.setSection)
				// console.log(tableData.findIndex( (section) => {
				// 	return section.Section === event.detail.msg.setSection;
				// 	})
				// )
				const slideNumber = event.detail.msg.setSection;
				changeAgendaItem(slideNumber);
			}
			
		})

		async function enableSource(sceneName, sourceName) {
			//Get the Scene Item Id number
			const sceneItemId = await obs.call("GetSceneItemId",{
				sceneName: sceneName,
				sourceName: sourceName,
			})
			//Set the 'Next Slide' Source to Enabled    
			await obs.call("SetSceneItemEnabled", {
				sceneName: sceneName,
				sceneItemId: Number(sceneItemId.sceneItemId),
				sceneItemEnabled: true
			});
		}	
		
		async function disableSource(sceneName, sourceName) {
			//Get the Scene Item Id number
            const sceneItemId = await obs.call("GetSceneItemId",{
				sceneName: sceneName,
                sourceName: sourceName,
            })
			//Set the 'Next Slide' Source to Enabled    
            await obs.call("SetSceneItemEnabled", {
				sceneName: sceneName,
                sceneItemId: Number(sceneItemId.sceneItemId),
                sceneItemEnabled: false
            });
        }
    </script>

<script id="handlebarsHelpers">

	    Handlebars.registerHelper('emoji', function(text) {
      // Example: Replace specific text with an emoji
      if (text === 'Word') {
        return '📔';
      }
      if (text === 'Humor') {
        return '🤣';
      }
      if (text === 'Thought') {
        return '💬';
      }
      if (text.startsWith('Speaker')) {
        return '🎙️';
      }
      if (text.startsWith('Table')) {
        return '❓';
      }
      if (text.includes('Eval')) {
        return '📊';
      }
      if (text ==='Timer') {
        return '⏰';
      }
      if (text ==='Ah-Counter') {
        return '👂';
      }
      return "";
    });
</script>

<script>
	      obs.on("SceneItemEnableStateChanged", async function (event) {
        const itemSource = await obs.call('GetSceneItemSource', {sceneName: event.sceneName, sceneItemId: event.sceneItemId })
          // obs.call('GetSceneItemSource', {sceneName: event.sceneName, sceneItemId: event.sceneItemId }).then(data => {
          //   console.log("Item source", data);
          // }); 
          console.log("state changed",event, itemSource);
          //console.log("state changed",itemSource.sourceName);
        switch(itemSource.sourceName){
          case 'cursor':
            break;
          case 'keyHotkey':
            if(event.sceneItemEnabled){
              notSoWeird('Obnoxious');
              timer = 3;
            }
            break;
          case 'Change Camera':
            console.log("change camera", event.sceneItemEnabled);
            break;
          case 'Next Slide':
            console.log("next slide", event.sceneItemEnabled);
			Reveal.next();
            break;
          case 'Previous Slide':
            console.log("next slide", event.sceneItemEnabled);
			Reveal.prev();
            break;
          default:
            break;
        }
      })
</script>
