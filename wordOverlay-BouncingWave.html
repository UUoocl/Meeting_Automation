        obs.on('Identified', async () => {
            const WotD = await obs.call("GetInputSettings", {
                inputName: 'Word'

            console.log('WotD', WotD)
            t = WotD.inputSettings.text;

        obs.on("SceneItemEnableStateChanged", async function (event) {
            itemSource = await obs.call('GetSceneItemSource', {sceneName: event.sceneName, sceneItemId: event.sceneItemId })
            // obs.call('GetSceneItemSource', {sceneName: event.sceneName, sceneItemId: event.sceneItemId }).then(data => {

            case 'cursor':
                break;
            case 'Show WotD':
                if(event.sceneItemEnabled && itemLock.sceneItemLocked){              
                await obs.call("SetSceneItemEnabled", {
                    sceneName: "Word of the Day",
                    sceneItemId: itemID.sceneItemId,
                    sceneItemEnabled: true
                }).then(setTimeout(async () => {
                    obs.call("SetSceneItemEnabled", {
                        sceneName: "Word of the Day",
                        sceneItemId: itemID.sceneItemId,
                        sceneItemEnabled: false
                    })
                }, 5000)
                );
                }
                break;
            case 'Change Camera':
                console.log("change camera", event.sceneItemEnabled);
                break;
            default:
                break;
            }
        })

        function loadScript(script, module) {
            const scriptElem = document.createElement("script");
            scriptElem.src = `${script}`;
            //scriptElem.async = script.async;
            if (module) {
                scriptElem.type = 'module';
            }
            else {
                scriptElem.type = 'text/javascript';
            }
            scriptElem.onload = () => {
                console.log(`${script} Script loaded successfully`);
            };
            scriptElem.onerror = () => {
                console.log(`${script} Error occurred while loading script`);
            };
            document.body.appendChild(scriptElem);
        }
